apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-service
  namespace: mlflow
  labels:
    app: inference-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inference-service
  template:
    metadata:
      labels:
        app: inference-service
    spec:
      containers:
        - name: inference-service
          image: mini-kubogent/inference:latest
          imagePullPolicy: Never   # image is loaded directly into kind, not pulled
          ports:
            - containerPort: 8000
          env:
            - name: MLFLOW_TRACKING_URI
              value: "http://mlflow-server.mlflow.svc.cluster.local:5000"
            - name: MODEL_NAME
              value: "mini-kubogent-iris-classifier"
            - name: MODEL_VERSION
              value: "latest"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: inference-service
  namespace: mlflow
spec:
  selector:
    app: inference-service
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
